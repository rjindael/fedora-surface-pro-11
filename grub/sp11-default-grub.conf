# Lines merged into /etc/default/grub by install.sh (KEY=VALUE, one per line).
# Fedora reads this single file directly during `grub2-mkconfig`; unlike
# Ubuntu there is no /etc/default/grub.d/ drop-in directory to sourced.

# Keep the GRUB menu available for selecting fallback kernels, but boot quickly.
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_RECORDFAIL_TIMEOUT=3

# Show the Windows entry (dual-boot) in the GRUB menu.
GRUB_DISABLE_OS_PROBER=false
