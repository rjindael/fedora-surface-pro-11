# hexagonrpcd-suspend.service / hexagonrpcd-resume.service drop-in override.
#
# The hexagonrpcd Debian package ships suspend/resume hooks that stop the
# sensors daemon before suspend and restart it after resume. They are guarded
# by ConditionFirmware=device-tree-compatible(qcom,sdm670), which is wrong for
# this board (qcom,x1e80100) — so the hooks were always skipped and the daemon
# held /dev/fastrpc-adsp open across suspend. This override corrects the
# condition so the hooks fire.
#
# Install (for BOTH suspend and resume units):
#   sudo mkdir -p /etc/systemd/system/hexagonrpcd-suspend.service.d
#   sudo mkdir -p /etc/systemd/system/hexagonrpcd-resume.service.d
#   sudo cp systemd/hexagonrpcd-condition-override.conf \
#       /etc/systemd/system/hexagonrpcd-suspend.service.d/override.conf
#   sudo cp systemd/hexagonrpcd-condition-override.conf \
#       /etc/systemd/system/hexagonrpcd-resume.service.d/override.conf
#   sudo systemctl daemon-reload
[Unit]
ConditionFirmware=
ConditionFirmware=device-tree-compatible(qcom,x1e80100)
